[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmware-knight"
version = "1.12.1"
description = "VMware vCenter/ESXi AI-powered VM lifecycle and deployment tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ehsan Emad", email = "nomadsoul18@gmail.com" }]
dependencies = [
    "pyvmomi>=8.0.3.0,<10.0",
    "pyaml>=24.0,<27.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "mcp[cli]>=1.10,<2.0",
    "vmware-policy>=1.17.0,<2.0",
    # Read-only cluster-health triage (summary + HTML snapshot) is owned by
    # vmware-monitor; VMware Knight delegates to it so a conversation with the VMware Knight
    # entry point can produce the same report without duplicating the code.
    "vmware-monitor>=1.13.0,<2.0",
]


[project.urls]
LinkedIn = "https://www.linkedin.com/in/ehsanemad/"
Homepage = "https://github.com/CyberKnightLabs/vmware-knight-mcp"
Repository = "https://github.com/CyberKnightLabs/vmware-knight-mcp"
Issues = "https://github.com/CyberKnightLabs/vmware-knight-mcp/issues"
Changelog = "https://github.com/CyberKnightLabs/vmware-knight-mcp/blob/main/RELEASE_NOTES.md"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
vmware-knight = "vmware_knight.cli:app"
vmware-knight-mcp = "vmware_knight.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["vmware_knight"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require vCenter)",
    "capability: Capability evals — scored trends, not pass/fail gates. Excluded from the default run (they measure quality, so <100% is expected and must not read as a broken build). Run them with: pytest -m capability",
]
# Capability evals are opt-in; see the marker description above.
addopts = "-m 'not capability'"
