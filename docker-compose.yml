services:
  vmware-knight-mcp:
    build: .
    image: vmware-knight:latest
    stdin_open: true
    tty: true
    volumes:
      # Mount your config and credentials
      - ~/.vmware-knight:/root/.vmware-knight:ro
    environment:
      - VMWARE_KNIGHT_CONFIG=/root/.vmware-knight/config.yaml
      # Add your password env vars here, e.g.:
      # - VMWARE_MY_VCENTER_PASSWORD=secret
